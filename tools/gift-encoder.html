<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gift Code Encoder</title>
<style>
  :root { --cream:#FFFAD3; --peach:#FFDBB0; --pink:#FFB1B1; --ink:#000; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 64px; background:var(--cream); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.note { margin: 0 0 20px; color:#444; }
  fieldset { border:0; background:#fff; border-radius:16px; padding:16px; margin:0 0 14px; box-shadow:0 4px 16px rgba(0,0,0,.06); }
  legend { font-weight:700; padding:0; margin-bottom:8px; float:left; width:100%; }
  label { display:block; font-size:13px; font-weight:600; margin:8px 0 4px; }
  input, textarea { width:100%; font:inherit; padding:10px 12px; border:1.5px solid #e6d9c3; border-radius:10px; background:#fffdf0; }
  textarea { min-height: 96px; resize: vertical; }
  .row { display:grid; grid-template-columns: 1fr 1fr 80px; gap: 10px; }
  button { font:inherit; font-weight:700; border:0; border-radius:999px; padding:12px 20px; background:var(--pink); cursor:pointer; }
  pre { white-space:pre-wrap; word-break:break-all; background:#fff; border-radius:12px; padding:14px; font-size:12px; }
  .ok { color:#1a7f37; font-weight:600; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>🎁 Gift Code Encoder</h1>
  <p class="note">
    Fill in each gift, press <b>Generate</b>, then replace the whole contents of
    <code>js/gifts.js</code> with the output. Nothing here is saved or sent anywhere.
    Codes ignore spaces and upper/lower case. Leave a code empty to skip that gift.
  </p>
  <form id="f"></form>
  <p><button type="button" id="gen">Generate gifts.js</button> <button type="button" id="copy" hidden>Copy</button> <span id="msg"></span></p>
  <pre id="out" hidden></pre>
</main>
<script src="../js/giftcodec.js"></script>
<script>
  var defaults = [
    { emoji: "🧸", name: "", story: "the thing that keeps you company when I can't" },
    { emoji: "🔑", name: "Matching keychains", story: "so you always carry a piece of us" },
    { emoji: "🪴", name: "Desk decor", story: "something for the space where you work or study hardest" },
    { emoji: "📿", name: "Bracelet", story: "something to wear, not just hold" },
  ];
  var f = document.getElementById("f");
  defaults.forEach(function (d, i) {
    var fs = document.createElement("fieldset");
    fs.innerHTML =
      '<legend>Gift ' + (i + 1) + '</legend>' +
      '<div class="row"><div><label>Code</label><input name="code"></div>' +
      '<div><label>Gift name</label><input name="name"></div>' +
      '<div><label>Emoji</label><input name="emoji"></div></div>' +
      '<label>Narrative (line breaks are kept)</label><textarea name="story"></textarea>';
    fs.querySelector('[name=name]').value = d.name;
    fs.querySelector('[name=emoji]').value = d.emoji;
    fs.querySelector('[name=story]').value = d.story;
    f.appendChild(fs);
  });
  var addBtn = document.createElement("button");
  addBtn.type = "button"; addBtn.textContent = "+ Add another gift";
  addBtn.style.background = "var(--peach)"; addBtn.style.marginBottom = "14px";
  addBtn.onclick = function () {
    var clone = f.lastElementChild.cloneNode(true);
    clone.querySelectorAll("input,textarea").forEach(function (el) { el.value = ""; });
    clone.querySelector("legend").textContent = "Gift " + (f.children.length + 1);
    f.appendChild(clone);
  };
  f.after(addBtn);

  document.getElementById("gen").onclick = function () {
    var entries = [], seen = {};
    for (var fs of f.children) {
      var get = function (n) { return fs.querySelector("[name=" + n + "]").value; };
      var code = GiftCodec.normalize(get("code"));
      if (!code) continue;
      if (seen[code]) { alert("Duplicate code: " + code); return; }
      seen[code] = 1;
      entries.push(GiftCodec.encode(code, { name: get("name").trim(), story: get("story").trim(), emoji: get("emoji").trim() }));
    }
    var js = "/* Generated by tools/gift-encoder.html — don't edit by hand.\n" +
      "   Each entry is [code hash, scrambled gift]. Regenerate to change codes. */\n" +
      "window.GIFTS = " + JSON.stringify(entries, null, 2) + ";\n";
    var out = document.getElementById("out");
    out.textContent = js; out.hidden = false;
    document.getElementById("copy").hidden = false;
    document.getElementById("msg").innerHTML = '<span class="ok">' + entries.length + ' gift(s) encoded ✓</span>';
  };
  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(document.getElementById("out").textContent).then(function () {
      document.getElementById("msg").innerHTML = '<span class="ok">Copied! Paste it into js/gifts.js</span>';
    });
  };
</script>
</body>
</html>
